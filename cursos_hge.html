    <!-- CABEÇALHO -->

            <a href="contatos_hge.html">Contatos</a>
            <a href="sobre_hge.html">Sobre</a>
        </nav>
    </header>

    <!-- TÍTULO -->

        <h1>Plataformas de Cursos</h1>
        <p>Acesse os principais portais de capacitação</p>
    </section>

    <!-- GRID DE CURSOS -->
    <section class="grid">

        <div class="card">
            <a href="https://www.escolavirtual.gov.br/catalogo" target="_blank">
                <img src="./assets_hge/EVG.png" alt="EVG">

        </div>

    </section>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>Desenvolvido por CTECI / NPD</p>
    </footer>

    <script>
        // Monitoramento do scroll global na janela para ocultar/mostrar o rodapé
        const rodape = document.querySelector('.rodape');
        let ultimoScroll = 0;

        window.addEventListener('scroll', () => {
            let scrollAtual = window.scrollY || document.documentElement.scrollTop;

            if (scrollAtual > ultimoScroll && scrollAtual > 20) {
                // Rolou para baixo -> Esconde o rodapé
                rodape.classList.add('rodape-oculto');
            } else {
                // Rolou para cima -> Mostra o rodapé
                rodape.classList.remove('rodape-oculto');
            }
            
            ultimoScroll = scrollAtual;
        });
    </script>
</body>
