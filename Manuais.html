    <!-- JAVASCRIPT ATUALIZADO PARA ALTERNAR AS ABAS E MONITORAR O SCROLL GLOBAL -->
    <script>
  /**
 * Alterna a visualização entre as abas principais (Manuais / Vídeos).
 * @param {Event} event - Evento do clique
 * @param {string} abaNome - Nome da aba a ser ativada ('manuais' ou 'videos')
 */
function alternarAba(event, abaNome) {
  // Remove a classe ativa de todos os botões de aba
  document.querySelectorAll('.btn-aba').forEach((btn) => {
    btn.classList.remove('ativa');
  });

  // Remove a classe ativa de todas as seções
  document.querySelectorAll('.secao-aba').forEach((secao) => {
    secao.classList.remove('ativa');
  });

  // Adiciona a classe ativa ao botão clicado
  event.currentTarget.classList.add('ativa');

  // Exibe a seção correspondente
  const secaoAlvo = document.getElementById(`aba-${abaNome}`);
  if (secaoAlvo) {
    secaoAlvo.classList.add('ativa');
  }
}

/**
 * Expande/oculta o conteúdo de uma categoria de tutoriais em vídeo.
 * @param {string} idCategoria - ID do elemento container do conteúdo
 * @param {Event} event - Evento do clique
 */
function toggleCategoria(idCategoria, event) {
  const conteudo = document.getElementById(idCategoria);
  const botao = event.target.closest('.btn-categoria');
  const containerGeral = document.querySelector('.container-categorias-horizontal');

  if (!conteudo || !botao || !containerGeral) return;

  const jaEstavaAtivo = conteudo.classList.contains('ativa');

  // Oculta todas as categorias ativas previamente
  document.querySelectorAll('.grid-categoria-conteudo').forEach((el) => {
    el.classList.remove('ativa');
  });
  document.querySelectorAll('.btn-categoria').forEach((el) => {
    el.classList.remove('ativa');
  });
  containerGeral.classList.remove('modo-selecionado');

  // Se não estava ativo, ativa a categoria selecionada
  if (!jaEstavaAtivo) {
    conteudo.classList.add('ativa');
    botao.classList.add('ativa');
    containerGeral.classList.add('modo-selecionado');
  }
}

/**
 * Oculta/exibe o rodapé com base no scroll da página.
 */
function inicializarScrollRodape() {
  const rodape = document.querySelector('.rodape');
  if (!rodape) return;

  let ultimoScroll = 0;

  window.addEventListener('scroll', () => {
    const scrollAtual = window.scrollY || document.documentElement.scrollTop;

    if (scrollAtual > ultimoScroll && scrollAtual > 20) {
      // Esconde o rodapé ao rolar para baixo
      rodape.classList.add('rodape-oculto');
    } else {
      // Mostra o rodapé ao rolar para cima
      rodape.classList.remove('rodape-oculto');
    }

    ultimoScroll = scrollAtual;
  });
}

// Inicializar comportamentos após o carregamento da DOM
document.addEventListener('DOMContentLoaded', () => {
  inicializarScrollRodape();
});
    </script>
