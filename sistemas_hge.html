    <script>
        // JS Atualizado para monitorar o scroll global da página (window) em vez do grid antigo
        const rodape = document.querySelector('.rodape');
        let ultimoScroll = 0;

        window.addEventListener('scroll', () => {
            let scrollAtual = window.scrollY || document.documentElement.scrollTop;

            if (scrollAtual > ultimoScroll && scrollAtual > 20) {
                // Rolou para baixo -> Esconde o rodapé
                rodape.classList.add('rodape-oculto');
            } else {
                // Rolou para cima -> Mostra o rodapé
                rodape.classList.remove('rodape-oculto');
            }
            
            ultimoScroll = scrollAtual;
        });
    </script>
